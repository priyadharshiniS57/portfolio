<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio Login - Access personal developer portfolio, projects, and dashboard.">
  <title>Login | Developer Portfolio</title>
  
  <!-- Modern Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Ambient background glow elements -->
  <div class="bg-glow-wrapper" aria-hidden="true">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
  </div>

  <!-- Main Centered Container -->
  <main class="login-container">
    <div class="login-card">
      
      <!-- Top Branding & Logo -->
      <header class="card-header">
        <div class="portfolio-logo" title="Developer Portfolio">
          <!-- Clean Terminal / Code Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div>
          <span class="brand-badge">Developer Portfolio</span>
        </div>
        <h1 class="card-title">Welcome Back</h1>
        <p class="card-subtitle">Login to continue to my portfolio</p>
      </header>

      <!-- Alert Banner for Invalid Credentials / Feedback -->
      <div id="authAlert" class="auth-alert" role="alert" aria-live="assertive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="authAlertMessage">Invalid credentials. Please try again.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form" novalidate>
        
        <!-- Username or Email Field -->
        <div class="form-group">
          <label for="usernameInput" class="form-label">Username or Email</label>
          <div class="input-wrapper">
            <!-- User Icon -->
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input 
              type="text" 
              id="usernameInput" 
              name="username" 
              class="form-input" 
              placeholder="e.g. admin or your email" 
              autocomplete="username"
              required
            >
          </div>
          <!-- Error message container -->
          <div id="usernameError" class="error-message" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span class="error-text">Username or Email is required.</span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-wrapper">
            <!-- Lock Icon -->
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              type="password" 
              id="passwordInput" 
              name="password" 
              class="form-input password-input" 
              placeholder="Enter your password" 
              autocomplete="current-password"
              required
            >
            <!-- Show/Hide Password Toggle Button -->
            <button 
              type="button" 
              id="togglePasswordBtn" 
              class="toggle-password" 
              aria-label="Show password"
              title="Show password"
            >
              <!-- Eye Icon (Default) -->
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye-Off Icon (Hidden by default) -->
              <svg id="eyeOffIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <!-- Error message container -->
          <div id="passwordError" class="error-message" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span class="error-text">Password is required.</span>
          </div>
        </div>

        <!-- Options: Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="remember-me" for="rememberMeCheckbox">
            <input type="checkbox" id="rememberMeCheckbox" name="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" id="forgotPasswordLink" class="forgot-password-link">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginBtn" class="btn-login">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Sign In</span>
        </button>

      </form>

      <!-- Quick Demo Credentials Hint Box (Helps visitors & testers) -->
      <div class="demo-helper">
        <div class="demo-helper-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>Demo Credentials</span>
        </div>
        <div class="demo-creds">
          <span>User: <code>admin</code></span>
          <span>Pass: <code>portfolio123</code></span>
        </div>
        <button type="button" id="autoFillBtn" class="btn-autofill">Click to auto-fill</button>
      </div>

    </div>
  </main>

  <!-- External JavaScript -->
  <script src="login.js" defer></script>
</body>
</html>
